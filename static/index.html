<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Manager</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f0f0f;
    color: #e0e0e0;
    min-height: 100vh;
  }

  header {
    background: #1a1a2e;
    padding: 1.5rem 2rem;
    border-bottom: 1px solid #2a2a3e;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  header h1 {
    font-size: 1.5rem;
    color: #fff;
    font-weight: 600;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 2rem;
  }

  .upload-zone {
    border: 2px dashed #3a3a5e;
    border-radius: 12px;
    padding: 3rem;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 2rem;
    background: #1a1a2e;
  }

  .upload-zone:hover, .upload-zone.dragover {
    border-color: #6c63ff;
    background: #1e1e3a;
  }

  .upload-zone p {
    color: #888;
    font-size: 1rem;
  }

  .upload-zone .icon {
    font-size: 3rem;
    margin-bottom: 1rem;
    display: block;
    color: #6c63ff;
  }

  #file-input { display: none; }

  .progress-bar {
    display: none;
    background: #1a1a2e;
    border-radius: 8px;
    margin-bottom: 2rem;
    padding: 1rem;
  }

  .progress-bar.active { display: block; }

  .progress-bar .track {
    background: #2a2a3e;
    border-radius: 4px;
    height: 8px;
    overflow: hidden;
    margin-top: 0.5rem;
  }

  .progress-bar .fill {
    background: #6c63ff;
    height: 100%;
    width: 0%;
    transition: width 0.3s;
    border-radius: 4px;
  }

  .progress-bar .status {
    font-size: 0.85rem;
    color: #aaa;
  }

  .video-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1rem;
  }

  .video-card {
    background: #1a1a2e;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #2a2a3e;
    transition: transform 0.2s, border-color 0.2s;
  }

  .video-card:hover {
    transform: translateY(-2px);
    border-color: #6c63ff;
  }

  .video-card .preview {
    background: #000;
    aspect-ratio: 16/9;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
  }

  .video-card .preview video {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .video-card .preview .play-icon {
    position: absolute;
    font-size: 3rem;
    color: rgba(255,255,255,0.7);
    pointer-events: none;
    transition: opacity 0.2s;
  }

  .video-card .preview:hover .play-icon {
    opacity: 0;
  }

  .video-card .info {
    padding: 1rem;
  }

  .video-card .filename {
    font-weight: 600;
    font-size: 0.95rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 0.5rem;
    color: #fff;
  }

  .video-card .meta {
    display: flex;
    gap: 1rem;
    font-size: 0.8rem;
    color: #888;
    flex-wrap: wrap;
  }

  .video-card .actions {
    display: flex;
    justify-content: flex-end;
    padding: 0.5rem 1rem 1rem;
  }

  .btn {
    padding: 0.4rem 0.8rem;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 500;
    transition: background 0.2s;
  }

  .btn-play {
    background: #6c63ff;
    color: #fff;
    margin-right: auto;
  }

  .btn-play:hover { background: #5a52d5; }

  .btn-delete {
    background: #3a1a1a;
    color: #ff6b6b;
  }

  .btn-delete:hover { background: #4a2020; }

  .empty-state {
    text-align: center;
    padding: 4rem 2rem;
    color: #555;
  }

  .empty-state .icon { font-size: 4rem; margin-bottom: 1rem; }

  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85);
    z-index: 1000;
    justify-content: center;
    align-items: center;
  }

  .modal-overlay.active { display: flex; }

  .modal-overlay video {
    max-width: 90vw;
    max-height: 90vh;
  }

  .modal-overlay .close-btn {
    position: fixed;
    top: 1rem;
    right: 1.5rem;
    background: none;
    border: none;
    color: #fff;
    font-size: 2rem;
    cursor: pointer;
  }

  @media (max-width: 600px) {
    .container { padding: 1rem; }
    .upload-zone { padding: 2rem 1rem; }
    .video-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>Video Manager</h1>
</header>

<div class="container">
  <div class="upload-zone" id="upload-zone">
    <span class="icon">&#9654;</span>
    <p>Drag & drop videos here, or click to select</p>
  </div>
  <input type="file" id="file-input" accept="video/*" multiple>

  <div class="progress-bar" id="progress-bar">
    <div class="status" id="progress-status">Uploading...</div>
    <div class="track"><div class="fill" id="progress-fill"></div></div>
  </div>

  <div id="video-list"></div>
</div>

<div class="modal-overlay" id="modal">
  <button class="close-btn" id="modal-close">&times;</button>
  <video id="modal-video" controls autoplay></video>
</div>

<script>
const uploadZone = document.getElementById('upload-zone');
const fileInput = document.getElementById('file-input');
const progressBar = document.getElementById('progress-bar');
const progressFill = document.getElementById('progress-fill');
const progressStatus = document.getElementById('progress-status');
const videoList = document.getElementById('video-list');
const modal = document.getElementById('modal');
const modalVideo = document.getElementById('modal-video');
const modalClose = document.getElementById('modal-close');

uploadZone.addEventListener('click', () => fileInput.click());
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('dragover');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', e => handleFiles(e.target.files));
modalClose.addEventListener('click', () => { modal.classList.remove('active'); modalVideo.src = ''; });
modal.addEventListener('click', e => { if (e.target === modal) { modal.classList.remove('active'); modalVideo.src = ''; } });

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' MB';
  return (bytes / 1073741824).toFixed(2) + ' GB';
}

function formatDuration(secs) {
  if (secs == null) return '--:--';
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  const s = Math.floor(secs % 60);
  if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${m}:${String(s).padStart(2,'0')}`;
}

function formatDate(iso) {
  return new Date(iso).toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
}

function openModal(id) {
  modalVideo.src = '/api/videos/' + id + '/stream';
  modal.classList.add('active');
}

async function deleteVideo(id) {
  if (!confirm('Delete this video?')) return;
  await fetch('/api/videos/' + id, { method: 'DELETE' });
  loadVideos();
}

function renderVideos(videos) {
  if (videos.length === 0) {
    videoList.innerHTML = `
      <div class="empty-state">
        <div class="icon">&#128249;</div>
        <p>No videos uploaded yet</p>
      </div>`;
    return;
  }
  videoList.innerHTML = '<div class="video-grid">' + videos.map(v => `
    <div class="video-card">
      <div class="preview" onclick="openModal('${v.id}')">
        <span class="play-icon">&#9654;</span>
      </div>
      <div class="info">
        <div class="filename" title="${v.original_filename}">${v.original_filename}</div>
        <div class="meta">
          <span>${formatSize(v.size)}</span>
          <span>${formatDuration(v.duration)}</span>
          <span>${formatDate(v.uploaded_at)}</span>
        </div>
      </div>
      <div class="actions">
        <button class="btn btn-play" onclick="openModal('${v.id}')">Play</button>
        <button class="btn btn-delete" onclick="deleteVideo('${v.id}')">Delete</button>
      </div>
    </div>
  `).join('') + '</div>';
}

async function loadVideos() {
  const res = await fetch('/api/videos');
  const videos = await res.json();
  renderVideos(videos);
}

async function handleFiles(files) {
  for (const file of files) {
    progressBar.classList.add('active');
    progressStatus.textContent = `Uploading ${file.name}...`;
    progressFill.style.width = '0%';

    const formData = new FormData();
    formData.append('file', file);

    try {
      const res = await fetch('/api/upload', { method: 'POST', body: formData });
      if (!res.ok) {
        const text = await res.text();
        alert('Upload failed: ' + text);
      }
    } catch (e) {
      alert('Upload failed: ' + e.message);
    }
  }

  progressBar.classList.remove('active');
  fileInput.value = '';
  loadVideos();
}

loadVideos();
</script>

</body>
</html>
